[project]
name = "dapnet-lite"
version = "2.0.0"
description = "Lightweight standalone DAPNET core (transmitter server + REST API)"
authors = [{ name = "Eddie Lim" }]
license = { text = "DAPNET Core licence (non-commercial, amateur radio use) - see LICENSE-NOTICES.txt" }
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dapnet"]
