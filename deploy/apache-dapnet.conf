# Reverse proxy for dapnet.lucifernet.com -> dapnet-core container (127.0.0.1:8097).
#
# DirectAdmin: create the subdomain "dapnet" under lucifernet.com, enable SSL
# (Let's Encrypt), then paste the block below into
#   Admin Level -> Custom HTTPD Configurations -> lucifernet.com
# so it survives `rewrite_confs`. It applies to both the :80 and :443 vhosts.
# Requires mod_proxy + mod_proxy_http + mod_headers (enabled in CustomBuild).

|*if SUB="dapnet"|
ProxyPreserveHost On
ProxyRequests Off
RequestHeader set X-Forwarded-Proto "https" env=HTTPS
ProxyPass        /.well-known/acme-challenge !
ProxyPass        /  http://127.0.0.1:8097/ timeout=60
ProxyPassReverse /  http://127.0.0.1:8097/
|*endif|
